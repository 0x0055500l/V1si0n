version: '3.8'

services:
  db:
    image: postgres:15
    container_name: v1si0n_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: v1si0n
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
    container_name: v1si0n_backend
    environment:
      DATABASE_URL: "postgresql://admin:adminpassword@db:5432/v1si0n"
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: v1si0n_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
